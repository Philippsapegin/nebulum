        font-weight: 400;
        font-display: block;
        src: url("/fonts/WireOne-Regular.ttf") format("truetype");
      }

      .runtime-loading-overlay {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background: #000;
        color: rgba(255, 255, 255, 0.94);
        font-family: "Wire One", "Albert Sans", sans-serif;
        font-size: clamp(64px, 8vw, 132px);
        letter-spacing: 0;
        opacity: 0;
        pointer-events: none;
        transition: opacity 180ms ease;
      }

      .runtime-loading-overlay span {
        transform: translateY(-0.02em);
      }

      html.runtime-restore-loading,
      html.runtime-restore-loading body {
        background: #000;
      }

      html.runtime-restore-loading .runtime-loading-overlay,
      .runtime-loading-overlay.runtime-loading-overlay--visible {
        opacity: 1;
        pointer-events: auto;
      }

      html.runtime-restore-loading .runtime-loading-overlay.runtime-loading-overlay--hiding,
      .runtime-loading-overlay.runtime-loading-overlay--hiding {
        opacity: 0;
        pointer-events: none;
        transition: opacity 260ms ease;
      }
    </style>
    <script>
      (() => {
        try {
          if (localStorage.getItem("nebulum:force-menu-on-next-launch") === "true") {
            return;
          }
          const shouldRestoreRuntime =
            sessionStorage.getItem("nebulum:runtime-reload-requested") === "true" ||
            Boolean(sessionStorage.getItem("nebulum:start-after-seed")) ||
            Boolean(sessionStorage.getItem("nebulum:start-after-runtime-session"));
          if (!shouldRestoreRuntime) {
            return;
          }
          const sessionRaw =
            sessionStorage.getItem("nebulum:start-after-runtime-session") ||
            localStorage.getItem("nebulum:runtime-session") ||
            "null";
          const session = JSON.parse(sessionRaw);
          if (
            sessionStorage.getItem("nebulum:start-after-seed") ||
            (session && session.seed && session.view && session.view !== "menu")
          ) {
            document.documentElement.classList.add("runtime-restore-loading");
          }
        } catch {}
      })();
    </script>

  <body>
    <svg class="filter-defs" aria-hidden="true" focusable="false">
      <filter
        id="stellar-edge-turbulence"
        x="-16%"
        y="-16%"
        width="132%"
        height="132%"
        color-interpolation-filters="sRGB"
      >
        <feTurbulence
          type="fractalNoise"
          baseFrequency="0.013 0.052"
          numOctaves="2"
          seed="11"
          result="stellarNoise"
        />
        <feOffset in="stellarNoise" dx="0" dy="0" result="movingStellarNoise">
          <animate
            attributeName="dx"
            dur="8s"
            values="0;24;48;72"
            repeatCount="indefinite"
          />
          <animate
            attributeName="dy"
            dur="8s"
            values="0;-10;-20;-30"
            repeatCount="indefinite"
          />
        </feOffset>
        <feDisplacementMap
          in="SourceGraphic"
          in2="movingStellarNoise"
          scale="3.5"
          xChannelSelector="R"
          yChannelSelector="G"
          result="displacedStar"
        />
        <feGaussianBlur
          in="displacedStar"
          stdDeviation="0.28"
          result="softStar"
        />
        <feComposite in="softStar" in2="displacedStar" operator="over" />
      </filter>
    </svg>

          <button id="game-breadcrumb-orbit" class="game-breadcrumb-button" type="button" aria-label="Back to orbit" data-tooltip="Back to orbit">
            <img src="/MainUI/ORBIT.svg" alt="" aria-hidden="true" />
          </button>
        </div>
        <div class="game-ui-panel" aria-label="Game sections">
          <button id="game-economy-button" class="game-ui-panel__button" type="button">
            <span class="game-ui-panel__icon-slot" aria-hidden="true"></span>
            <span class="game-ui-panel__text">ECONOMY</span>
          </button>
          <button id="game-diplomacy-button" class="game-ui-panel__button" type="button">
            <span class="game-ui-panel__icon-slot" aria-hidden="true">
              <img src="/MainUI/DIPLOMACY.svg" alt="" />
            </span>
            <span class="game-ui-panel__text">DIPLOMACY</span>
          </button>
        </div>
        <div class="sign-turn-panel">
          <button id="sign-turn-button" class="sign-turn-button" type="button">
            <span>SIGN TURN</span>
          </button>
          <div id="turn-order-track" class="turn-order-track" aria-label="Turn order"></div>
        </div>
      </div>
      <div id="fleet-action-panel" class="fleet-action-panel" aria-label="Fleet actions" hidden></div>
      <section id="star-window" class="star-window" aria-hidden="true">
        <canvas id="system-glow" class="system-glow" aria-hidden="true"></canvas>
        <div id="system-stars" class="system-stars" aria-hidden="true"></div>
        <div id="star-system" class="star-system" aria-hidden="true"></div>
        <div id="system-star-layer" class="system-star-layer" aria-hidden="true"></div>
        <div id="system-particles" class="system-particles" aria-hidden="true"></div>
        <div id="system-hover-name-wrap" class="hover-name-wrap system-hover-name-wrap" aria-hidden="true">
          <div id="system-hover-name" class="hover-name"></div>
          <div class="hover-name-line"></div>
        </div>
        <div id="system-hover-panel" class="hover-panel system-hover-panel" aria-hidden="true">
          <div class="hover-panel__line hover-panel__line--top"></div>
          <div id="system-tooltip-body" class="hover-panel__body system-tooltip-body"></div>
          <div class="hover-panel__line hover-panel__line--bottom"></div>
        </div>
        <div id="system-title" class="system-title" aria-hidden="true"></div>
        <div class="system-top-bar">
          <button id="back-to-starmap" class="back-button" type="button">Back to starmap</button>
          <button id="toggle-tidal-zone" class="zone-toggle" type="button" aria-pressed="false">Tidal Lock</button>
          <button id="toggle-hz-zone" class="zone-toggle" type="button" aria-pressed="false">Habitable Zone</button>
        </div>
        <svg id="planet-link" class="planet-link" aria-hidden="true">
          <path id="planet-link-path"></path>
        </svg>
        <div id="planet-window" class="planet-window" aria-hidden="true">
          <button id="planet-window-close" class="planet-window__close" type="button" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
          <div class="planet-window__visual">
            <div id="planet-window-title" class="planet-window__title"></div>
            <div id="planet-window-size" class="planet-window__size"></div>
            <div id="planet-window-stage" class="planet-window__stage"></div>
          </div>
          <div class="planet-window__info">
            <div id="planet-window-lore" class="planet-window__lore"></div>
            <div id="planet-window-divider" class="planet-window__divider"></div>
            <div id="planet-window-tags" class="planet-window__tags"></div>
          </div>
        </div>
        <section id="planet-screen" class="planet-screen" aria-hidden="true">
          <div class="planet-screen__top-bar">
            <button id="planet-screen-back-starmap" class="back-button" type="button">Back to starmap</button>
            <button id="planet-screen-back-system" class="back-button" type="button">Back to starsystem</button>
          </div>
        </section>
        <section id="object-detail-screen" class="object-detail-screen" aria-hidden="true">
          <div class="object-detail-screen__top-bar">
            <button id="object-detail-back-starmap" class="back-button" type="button">Back to starmap</button>
            <button id="object-detail-back-system" class="back-button" type="button">Back to starsystem</button>
            <button id="object-detail-back-orbit" class="back-button" type="button">Back to orbit</button>
          </div>
          <div class="object-detail-screen__layout">
            <aside class="object-detail-screen__side-panel object-detail-screen__side-panel--left" aria-hidden="true"></aside>
            <div id="object-detail-texture" class="object-detail-screen__texture" aria-hidden="true"></div>
            <div id="object-detail-stage-control" class="object-detail-stage-control" hidden>
              <span class="object-detail-stage-control__label">STATE</span>
              <input id="object-detail-stage-input" class="object-detail-stage-control__input" type="range" min="1" max="10" value="1" step="1" />
            </div>
            <aside class="object-detail-screen__side-panel object-detail-screen__side-panel--right" aria-hidden="true">
              <div class="object-detail-screen__governor">
                <div class="object-detail-screen__governor-portrait"></div>
                <div class="object-detail-screen__governor-text">
                  <div id="object-detail-governor-name" class="object-detail-screen__governor-name">Unassigned</div>
                  <div class="object-detail-screen__governor-role">GOVERNOR</div>
                </div>
              </div>
            </aside>
          </div>
        </section>
      </section>
    </main>
    <div id="runtime-loading-overlay" class="runtime-loading-overlay" aria-hidden="true">
      <span>LOADING</span>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
